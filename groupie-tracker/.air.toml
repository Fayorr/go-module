root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
# This tells Air where your main.go is and where to output the built binary
cmd = "go build -o ./tmp/main ./cmd/web"

# This is the path to the binary Air will execute
bin = "./tmp/main"

# Watch these file extensions for changes
include_ext = ["go", "tpl", "tmpl", "html", "css", "js"]

# Ignore these directories so Air doesn't restart unnecessarily
exclude_dir = ["assets", "tmp", "vendor", "testdata"]